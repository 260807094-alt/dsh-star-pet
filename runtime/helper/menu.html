<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单</title>
<style>
	@font-face {
		font-family: "StarPetSoft";
		src: url("../../assets/Ruanti.ttf") format("truetype");
		font-display: block;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
	#shell {
		position: absolute; inset: 0;
		background: #2b3242;
		border-radius: 10px;
		padding: 1px;
	}
	#body {
		width: 100%;
		background: #15191f;
		border-radius: 9px;
		padding: 4px;
		display: flex;
		flex-direction: column;
		font-family: var(--pet-font, "StarPetSoft", "Microsoft YaHei", sans-serif);
	}
	.row {
		position: relative;
		flex: 0 0 28px;
		height: 28px;
		display: flex;
		align-items: center;
		justify-content: center;
		border-radius: 6px;
		font-size: 13.3px;
		color: #e9eef8;
		cursor: default;
		white-space: nowrap;
	}
	.row:hover { background: #1b212a; }
	.row.on { color: #3ad17f; }
	.row.off { color: #7d8798; }
	.row .mark {
		position: absolute;
		right: 8px;
		top: 50%;
		transform: translateY(-50%);
		font-size: 12px;
	}
	#sizes {
		display: none;
		grid-template-columns: 1fr 1fr 1fr;
		gap: 5px;
		padding: 2px;
	}
	#sizes .cell {
		height: 30px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #1b212a;
		border-radius: 6px;
		font-size: 12px;
		color: #e9eef8;
	}
	#sizes .cell.on { background: #1d3a2b; color: #3ad17f; }
	#sizes .title { grid-column: 1 / -1; text-align: center; color: #7d8798; font-size: 12px; padding: 2px 0 4px; }
</style>
</head>
<body>
	<div id="shell">
		<div id="body">
			<div id="items"></div>
			<div id="sizes"></div>
		</div>
	</div>
	<script src="./core.js"></script>
	<script src="./menu.js"></script>
</body>
</html>
